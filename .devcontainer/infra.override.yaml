services:
  worker:
    image: docta-worker:latest
    env_file: !override []
    environment:
      DOCTA_DEV_MANAGED: "1"
      DOCTA_DATABASE_URL: ${DOCTA_DEV_WORKER_DATABASE_URL}
      DOCTA_S3_ACCESS_KEY: ${DOCTA_S3_ACCESS_KEY}
      DOCTA_S3_SECRET_KEY: ${DOCTA_S3_SECRET_KEY}
      DOCTA_S3_BUCKET: ${DOCTA_S3_BUCKET}
      DOCTA_S3_REGION: ${DOCTA_S3_REGION:-us-east-1}
      DOCTA_DEPENDENCY_TIMEOUT_SECONDS: ${DOCTA_DEPENDENCY_TIMEOUT_SECONDS:-2}
      DOCTA_UPLOAD_TTL_SECONDS: ${DOCTA_UPLOAD_TTL_SECONDS:-900}
      DOCTA_MAX_DOCUMENT_BYTES: ${DOCTA_MAX_DOCUMENT_BYTES:-10485760}
      DOCTA_MAX_DOCUMENT_PAGES: ${DOCTA_MAX_DOCUMENT_PAGES:-200}
      DOCTA_CHUNK_SIZE_CHARACTERS: ${DOCTA_CHUNK_SIZE_CHARACTERS:-1600}
      DOCTA_CHUNK_OVERLAP_CHARACTERS: ${DOCTA_CHUNK_OVERLAP_CHARACTERS:-160}
      DOCTA_PIPELINE_VERSION: ${DOCTA_PIPELINE_VERSION:-phase0-pymupdf-v1}
      DOCTA_REDIS_STREAM: ${DOCTA_REDIS_STREAM:-docta:jobs:ingestion:v1}
      DOCTA_REDIS_GROUP: ${DOCTA_REDIS_GROUP:-docta-ingestion-workers-v1}
      DOCTA_JOB_LEASE_SECONDS: ${DOCTA_JOB_LEASE_SECONDS:-300}
      DOCTA_JOB_MAX_ATTEMPTS: ${DOCTA_JOB_MAX_ATTEMPTS:-3}
      DOCTA_JOB_RETRY_BASE_SECONDS: ${DOCTA_JOB_RETRY_BASE_SECONDS:-2}
      DOCTA_JOB_RECONCILE_SECONDS: ${DOCTA_JOB_RECONCILE_SECONDS:-30}
  postgres:
    ports: !override ["127.0.0.1:${POSTGRES_PORT}:5432"]
  minio:
    ports: !override
      - "127.0.0.1:${MINIO_API_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
