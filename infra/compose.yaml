name: docta

services:
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DOCTA_DATABASE_URL: postgresql://${POSTGRES_USER:-docta}:${POSTGRES_PASSWORD:-docta_local_only}@postgres:5432/${POSTGRES_DB:-docta}
      DOCTA_MINIO_HEALTH_URL: http://minio:9000/minio/health/ready
      DOCTA_S3_ENDPOINT_URL: http://minio:9000
      DOCTA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docta}
      POSTGRES_USER: ${POSTGRES_USER:-docta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docta_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docta-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docta-local-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${DOCTA_WEB_ORIGIN:-http://127.0.0.1:3000}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - minio-data:/data

volumes:
  redis-data:
  postgres-data:
  minio-data:
