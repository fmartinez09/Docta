name: docta-test

services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    image: docta-postgres:16.10-pgvector0.8.7
    environment:
      POSTGRES_USER: docta_test
      POSTGRES_PASSWORD: docta_test_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${DOCTA_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docta_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-test-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: docta-test
      RUSTFS_SECRET_KEY: docta-test-secret
      # The isolated browser test chooses a random loopback port.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "127.0.0.1:${DOCTA_TEST_STORAGE_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rustfs-test-data:/data

volumes:
  postgres-test-data:
  redis-test-data:
  rustfs-test-data:
