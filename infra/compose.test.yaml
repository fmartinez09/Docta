name: docta-test

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: docta_test
      POSTGRES_PASSWORD: docta_test_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docta_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - redis-test-data:/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docta-test
      MINIO_ROOT_PASSWORD: docta-test-secret
    ports:
      - "127.0.0.1:${DOCTA_TEST_MINIO_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - minio-test-data:/data

volumes:
  postgres-test-data:
  redis-test-data:
  minio-test-data:
